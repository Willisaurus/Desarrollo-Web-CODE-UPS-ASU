<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="img/logo.jpg">
    <title>Iniciar sesión - CODE UPS</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <div class="header-top con-acciones">
            <h1>CODE UPS</h1>
            <div class="barra-usuario">
                <a href="index.html">Volver al inicio</a>
            </div>
        </div>
    </header>

    <main class="contenedor-angosto">
        <section>
            <h2>Iniciar sesión</h2>
            <form id="form-login" novalidate>
                <fieldset>
                    <legend>Acceso para estudiantes</legend>

                    <div class="campo-formulario">
                        <label for="correo">Correo institucional:</label>
                        <input type="email" id="correo" name="correo" placeholder="usuario@est.ups.edu.ec" autocomplete="username" required>
                    </div>

                    <div class="campo-formulario">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                    </div>

                    <p id="mensaje-login" aria-live="polite"></p>

                    <div class="grupo-botones">
                        <button type="submit">Ingresar</button>
                    </div>
                </fieldset>
            </form>
            <p class="texto-ayuda">¿Aún no tienes cuenta? <a href="index.html#inscripcion">Regístrate aquí</a></p>
        </section>
    </main>

    <footer>
        <address>Contacto: codeups@ups.edu.ec</address>
        <p>&copy; 2026 CODE UPS - Universidad Politécnica Salesiana.</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
